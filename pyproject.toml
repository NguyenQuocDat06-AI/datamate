[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bizreason"
version = "0.1.0"
description = "Source-grounded business data reasoning over CSV, Excel, and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "openpyxl>=3.1,<4", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "black>=24", "pyflakes>=3"]
calibration = ["scikit-learn>=1.5,<2"]

[project.scripts]
bizreason = "bizreason.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bizreason*", "serve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
